<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Isabel</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="icon" type="image/png" href="iconos/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#FBF8F3; --tarjeta:#FFFFFF; --borde:#E7E1D8; --borde-campo:#D9D1C4;
  --texto:#1F2328; --texto2:#444A51; --suave:#5B6168; --tinta:#23395B;
  --medico:#1F5F99; --medico-f:#E6F0F9;
  --ocio:#A34A0A;   --ocio-f:#FCEEE3;
  --compra:#9A2C62; --compra-f:#FBE9F1;
  --varios:#5A3F92; --varios-f:#EFEAF7;
  --receta:#1E6640; --receta-f:#E5F3EA;
  --nota:#5A4300;   --nota-f:#FFF6D6;
  --abajo: env(safe-area-inset-bottom, 0px);
  --arriba: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--texto)}
body{font-family:'Atkinson Hyperlegible',-apple-system,system-ui,sans-serif;font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2{margin:0}
.oculto{display:none!important}

/* Estructura */
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
#contenido{padding:calc(var(--arriba) + 24px) 20px calc(190px + var(--abajo)) 20px}
.cabecera{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.cabecera h1{font-size:34px;line-height:1.15}
.icono-seccion{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--tinta)}
.saludo{font-size:32px;font-weight:700;line-height:1.15;margin:4px 0}
.fecha-hoy{font-size:18px;color:var(--suave);margin-bottom:20px}
.titulo-bloque{font-size:20px;font-weight:700;margin:18px 0 12px}
.titulo-bloque.pequeno{font-size:17px;letter-spacing:.03em}
.lista{display:flex;flex-direction:column;gap:12px}
.vacio{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:16px 18px;color:var(--suave)}

/* Tarjetas de cita */
.cita{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:12px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.dia{width:64px;height:68px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.dia .ds{font-size:14px;font-weight:700}
.dia .dn{font-size:28px;font-weight:700;line-height:1}
.cita .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.cita .t{font-size:20px;font-weight:700}
.cita .s{font-size:17px;color:var(--texto2)}
.cita .etq{font-size:14px;font-weight:700}
.cita-larga{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.cita-larga .cuando{font-size:17px;font-weight:700}
.cita-larga .t{font-size:21px;font-weight:700}
.cita-larga .s{font-size:17px;color:var(--texto2)}
.cita-larga.pasada{opacity:.7}
.nota{margin-top:4px;background:var(--nota-f);border-radius:10px;padding:8px 12px;font-size:17px;color:var(--nota);white-space:pre-line}
.medico .dia,.icono-seccion.medico{background:var(--medico-f);color:var(--medico)} .medico .etq,.medico .cuando{color:var(--medico)}
.ocio .dia,.icono-seccion.ocio{background:var(--ocio-f);color:var(--ocio)} .ocio .etq,.ocio .cuando{color:var(--ocio)}
.icono-seccion.compra{background:var(--compra-f);color:var(--compra)}
.icono-seccion.varios{background:var(--varios-f);color:var(--varios)}
.icono-seccion.recetas{background:var(--receta-f);color:var(--receta)}
.plegable{height:56px;border-radius:16px;border:1px solid var(--borde);background:#F3EEE6;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 18px;width:100%;margin-top:6px}

/* Botón Apuntar y barra */
#apuntar-fab{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 40px));bottom:calc(104px + var(--abajo));height:64px;border-radius:32px;background:var(--tinta);color:#fff;border:none;display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;font-weight:700;box-shadow:0 6px 18px rgba(35,57,91,.25);z-index:5}
#barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:8px 4px calc(10px + var(--abajo));z-index:6}
#barra .dentro{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
#barra button{border:none;background:transparent;height:66px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--suave);padding:0}
#barra button.activo{font-weight:700}
#barra button[data-tab=inicio].activo{background:#ECE6DC;color:var(--texto)}
#barra button[data-tab=medico].activo{background:var(--medico-f);color:var(--medico)}
#barra button[data-tab=ocio].activo{background:var(--ocio-f);color:var(--ocio)}
#barra button[data-tab=compra].activo{background:var(--compra-f);color:var(--compra)}
#barra button[data-tab=varios].activo{background:var(--varios-f);color:var(--varios)}
#barra button[data-tab=recetas].activo{background:var(--receta-f);color:var(--receta)}

/* Compra */
.fila-anadir{display:flex;gap:8px;margin-bottom:8px}
.campo{width:100%;height:56px;border-radius:16px;border:1px solid var(--borde-campo);background:#fff;padding:0 16px;font-size:19px}
.boton-cuadrado{width:56px;height:56px;flex-shrink:0;border-radius:16px;border:none;background:var(--tinta);color:#fff;display:flex;align-items:center;justify-content:center}
.caja-lista{background:#fff;border:1px solid var(--borde);border-radius:16px;overflow:hidden}
.producto{min-height:56px;width:100%;display:flex;align-items:center;gap:14px;padding:8px 16px;background:transparent;border:none;border-bottom:1px solid #EFE9E0;font-size:20px;text-align:left}
.producto:last-child{border-bottom:none}
.casilla{width:28px;height:28px;border-radius:8px;border:2px solid #8A8F96;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.producto.hecho{color:#6B7178;text-decoration:line-through;font-size:19px}
.producto.hecho .casilla{background:var(--compra);border-color:var(--compra);color:#fff}
.caja-lista.carro{background:#F3EEE6;border:none}
.fila-titulo{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.fila-titulo .titulo-bloque{margin:0}
.boton-suave{height:44px;border-radius:12px;border:1px solid var(--borde-campo);background:#fff;padding:0 14px;font-size:16px;color:var(--texto2)}

/* Varios y recetas */
.nota-varios{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;font-size:20px;white-space:pre-line}
.nota-varios.fijada{background:var(--varios-f);border-color:transparent}
.nota-varios .cuando{font-size:15px;color:var(--suave)}
.receta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.receta .cab{display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:0;text-align:left;width:100%;font-size:21px;font-weight:700;gap:12px}
.receta .sub{font-size:16px;font-weight:700;color:var(--receta)}
.receta .txt{font-size:18px;line-height:1.5;color:#2C3137;white-space:pre-line}
.buscador{position:relative;margin-bottom:12px}
.buscador svg{position:absolute;left:16px;top:16px;color:var(--suave)}
.buscador input{padding-left:52px}

/* Hoja de apuntar / editar */
#hoja{position:fixed;inset:0;background:var(--fondo);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
#hoja .dentro{max-width:560px;margin:0 auto;padding:calc(var(--arriba) + 20px) 20px calc(28px + var(--abajo));display:flex;flex-direction:column;gap:12px;min-height:100%}
.hoja-cab{display:flex;align-items:center;justify-content:space-between}
.hoja-cab h1{font-size:30px}
.cerrar{width:48px;height:48px;border-radius:24px;background:#ECE6DC;border:none;display:flex;align-items:center;justify-content:center}
.aviso-madrid{background:#E3E8F0;color:var(--tinta);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;text-align:center}
.micro{width:108px;height:108px;border-radius:54px;border:8px solid #E3E8F0;background:var(--tinta);color:#fff;display:flex;align-items:center;justify-content:center;align-self:center;transition:transform .15s}
.micro.escuchando{background:#B3261E;border-color:#F6D5D3;animation:latido 1.1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.06)}}
.etiqueta{font-size:16px;font-weight:700;color:var(--suave)}
textarea.area{width:100%;font-size:20px;line-height:1.35;background:#fff;border:1px solid var(--borde-campo);border-radius:14px;padding:12px 14px;resize:none}
.tarjeta-propuesta{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{height:44px;border-radius:12px;border:1px solid var(--borde-campo);background:#fff;font-size:15px;color:var(--texto2);padding:0}
.chip.sel{border-width:2px;font-weight:700}
.chip.sel[data-sec=medico]{border-color:var(--medico);background:var(--medico-f);color:var(--medico)}
.chip.sel[data-sec=ocio]{border-color:var(--ocio);background:var(--ocio-f);color:var(--ocio)}
.chip.sel[data-sec=compra]{border-color:var(--compra);background:var(--compra-f);color:var(--compra)}
.chip.sel[data-sec=varios]{border-color:var(--varios);background:var(--varios-f);color:var(--varios)}
.chip.sel[data-sec=receta]{border-color:var(--receta);background:var(--receta-f);color:var(--receta)}
.fila-campo{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #EFE9E0;padding-bottom:8px}
.fila-campo label{color:var(--suave);font-size:18px;flex-shrink:0}
.fila-campo input{border:none;background:transparent;font-size:19px;font-weight:700;text-align:right;min-width:0;width:100%;padding:6px 0}
.fila-campo input:focus{outline:2px solid #C7D3E3;border-radius:6px}
.fila-campo.falta label{color:#B3261E;font-weight:700}
textarea.notas{width:100%;font-size:18px;line-height:1.35;background:var(--nota-f);border:1px solid #E6D9B0;border-radius:12px;padding:10px 12px;resize:none}
.boton-principal{height:64px;border-radius:32px;background:var(--tinta);color:#fff;border:none;font-size:21px;font-weight:700;width:100%}
.boton-principal:disabled{opacity:.5}
.boton-texto{height:44px;border:none;background:none;font-size:18px;color:var(--texto2)}
.boton-borrar{height:52px;border-radius:26px;border:1px solid #E7B7B3;background:#fff;color:#B3261E;font-size:18px;font-weight:700}
.interruptor{display:flex;align-items:center;justify-content:space-between;font-size:18px;padding:6px 0}
.interruptor input{width:28px;height:28px;accent-color:var(--varios)}
.pie-hoja{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}

/* Configuración */
.config{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.config p{color:var(--texto2);margin:0}
.error{color:#B3261E;font-weight:700}
.enlace-config{display:block;margin:36px auto 0;background:none;border:none;color:var(--suave);font-size:15px;text-decoration:underline}

/* Avisos */
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(184px + var(--abajo));background:var(--texto);color:#fff;padding:12px 18px;border-radius:14px;font-size:17px;z-index:40;max-width:calc(100% - 40px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#cargando{position:fixed;top:calc(var(--arriba) + 8px);right:14px;width:12px;height:12px;border-radius:6px;background:var(--tinta);opacity:.6;z-index:30;animation:latido 1s infinite}
</style>
</head>
<body>
<div id="app">
  <main id="contenido" aria-live="polite"></main>
  <button id="apuntar-fab" type="button" class="oculto" aria-label="Apuntar algo nuevo">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Apuntar
  </button>
  <nav id="barra" class="oculto" aria-label="Secciones"><div class="dentro"></div></nav>
</div>
<div id="hoja" class="oculto" role="dialog" aria-modal="true"></div>
<div id="aviso" class="oculto" role="status"></div>
<div id="cargando" class="oculto" aria-hidden="true"></div>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
